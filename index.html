<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="container">
    <header class="header">
        <div class="header-top">
            <img src="https://img.icons8.com/material-outlined/24/ffffff/left.png" alt="back">
            <span>Profile Card</span>
        </div>
    </header>

    <div class="info-main">
        <div class="img-container">
            <img src="./assets/pages/James Alan Hetfield.jpg" alt="James Hetfield" class="photo">
        </div>

        <div class="info-header">
            <div class="info-heder1">Alan Hetfield</div>
            <div class="info-heder2">American musician, vocalist, guitarist, and co-founder of the legendary thrash metal band Metallica, who became one of the most influential frontmen in the history of heavy music.</div>
        </div>

    <footer class="footer">
        <button class="btn btn-follow">Follow</button>
    </footer>

<div class="stats-container">
    <div class="stats-item">
        <div class="stats-icon">
            <img src="https://img.icons8.com/material-outlined/24/ffffff/image.png" alt="posts">
        </div>
        <div class="stats-text-block">
            <div class="stats-label">Posts</div>
            <div class="stats-value">120</div>
        </div>
    </div>

    <div class="divider"></div>

    <div class="stats-item">
        <div class="stats-icon">
            <img src="https://img.icons8.com/material-outlined/24/ffffff/like--v1.png" alt="followers">
        </div>
        <div class="stats-text-block">
            <div class="stats-label">Followers</div>
            <div class="stats-value">15M</div>
        </div>
    </div>

    <div class="divider"></div>

    <div class="stats-item">
        <div class="stats-icon">
            <img src="https://img.icons8.com/material-outlined/24/ffffff/sent.png" alt="messages">
        </div>
        <div class="stats-text-block">
            <div class="stats-label">Following</div>
            <div class="stats-value">340</div>
        </div>
    </div>
</div>
</div>
</div>
</body>
</html>
